[server]
host = 127.0.0.1
port = 5061
debug = true

[worksheet]
page_title = Handwriting Practice
paper_size = A4
orientation = tall
margin_mm = 12
max_text_chars = 5000
line_height_mm = 12
rows_per_block = 3
line_spacing = single
following_lines = repeat

[guides]
darkness = 30
thickness = 0.5
# classic = base and top solid, aiming lines dashed. four = solid outer lines,
# dashed middle lines. Or force every line: solid | dashed | dotted
style = classic
english_top_line = true
english_mid_line = true
english_descender_line = false
hindi_shiro_rekha = true
hindi_upper_matra_line = true
hindi_lower_matra_line = false

[letters]
# dashed | dotted | outlined | solid
style = dashed
darkness = 50
# stroke width in pt for dashed, dotted and outlined letters; also the dot size
thickness = 0.6
# solid style: single = flat fill, double = fill + outline
solid_layers = single
# outline weight for double solid, in pt; 0 leaves the letter at its true width
solid_weight = 0
# trace marks: single = one dash/dot, double = two side by side
trace_layers = single
# how far apart the dashes/dots sit: tight | normal | wide
trace_spacing = normal

[fonts]
fonts_dir = app/static/fonts
english_default = Andika-Regular.ttf
hindi_default = NotoSansDevanagari-Regular.ttf

[output]
save_generated = false
output_dir = output
